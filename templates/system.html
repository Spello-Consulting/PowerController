{% extends "base.html" %}

{% block title %}System · {{ app_label }}{% endblock %}

{% block content %}
<div class="info-page">
  <h2>System information</h2>
  <div class="info-card">
    {% for label, value in system_info.items() %}
    <div class="info-row"><span class="info-label">{{ label }}</span><span class="info-value">{{ value }}</span></div>
    {% endfor %}
  </div>
  <p><a class="btn" href="/{% if access_key %}?key={{ access_key }}{% endif %}">← Back to home</a></p>
</div>
{% endblock %}
