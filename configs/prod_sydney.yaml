General:
  # A label for this installation - used in the email subject and web viewer app
  Label: Sydney
  PollingInterval: 10
  # Some critical errors can trigger email notifications - for example the AmberAPI not responding. This is the time in minutes for an issue to 
  # persist before we send an email notification. Leave blank to disable.
  ReportCriticalErrorsDelay: 10
  # Print some basic information to the console during startup and operation
  PrintToConsole: False
  # A default price to use if the Amber API is not available and there is no schedule price defined
  DefaultPrice: 32.0


Website:
  HostingIP: 0.0.0.0
  Port: 8080
  # How often to refresh the web page (in seconds). Set to 0 to disable auto-refresh.
  PageAutoRefresh: 10
  DebugMode: False


AmberAPI:
  # Operating mode for the Amber API: Live (attempt to download prices), Offline (pretend Amber API is offline, use cached prices). Disabled (fall back to schedule)
  Mode: Live
  # The base URL for the Amber API - do not change this unless instructed to do so
  APIURL: https://api.amber.com.au/v1
  # How long to wait for a response from the Amber API
  Timeout: 15
  # Exit the application if we get this number of concurrent errors from Amber that aren't timeouts
  MaxConcurrentErrors: 4
  # How often to refresh the pricing data from Amber (in minutes)
  RefreshInterval: 15
  # Save usage data to a CSV file for offline use. Leave blank to disable
  UsageDataFile: logs/amber_usage_data.csv
  # Maximum number of days to keep
  UsageMaxDays: -1
  # Location of the latest prices data cache file
  PricesCacheFile: logs/latest_prices.json


# Use this section to configure your smart devices used to control the lights
SCSmartDevices:
  AllowDebugLogging: False
  ResponseTimeout: 8
  RetryCount: 3
  RetryDelay: 5
  # Send an email notification if we get this number of concurrent errors
  MaxConcurrentErrors: 6
  PingAllowed: True
  Devices:
    - Name: Pool Pump
      Model: ShellyPlus1PM
      Hostname: 192.168.87.20
      DeviceAlertTemp: 85.0
      Inputs:
        - Name: "Pool Pump Input"
      Outputs:
        - Name: "Pool Pump Output"
      Meters:
        - Name: "Pool Pump Meter"
    - Name: Pool Solar
      Model: Shelly2PMG3
      Hostname: 192.168.87.21
      DeviceAlertTemp: 85.0
      Outputs:
        - Name: "Solar Pump"
        - Name: "Solar Valve"
      Meters:
        - Name: "Solar Pump Meter"
        - Name: "Solar Valve Meter"
      TempProbes:
        - Name: "Pool Solar"
        - Name: "Temp Pool Water"
          RequiresOutput: "Pool Pump Output"
        - Name: "Temp Solar Return"
          RequiresOutput: "Solar Pump"
        - Name: "Temp Roof"
        - Name: "Temp Air"
    - Name: Pool Solar Fan
      Model: ShellyPlus1PM
      Hostname: 192.168.87.22
      DeviceAlertTemp: 80.0
      Outputs:
        - Name: "Solar Fan Output"
    - Name: Hot Water
      Model: ShellyEM
      Hostname: 192.168.87.23
      ExpectOffline: True
      Outputs:
        - Name: "Hot Water O1"
      Meters:
        - Name: "Hot Water M1"
        - Name: "Hot Water M2"
    - Name: Power EM1
      Model: ShellyEMG3
      Hostname: 192.168.87.40
      ExpectOffline: True
      Meters:
        - Name: "Power EM1.1"
        - Name: "Power EM1.2"
    - Name: Power EM2
      Model: ShellyEMG3
      Hostname: 192.168.87.41
      ExpectOffline: True
      Meters:
        - Name: "Power EM2.1"
        - Name: "Power EM2.2"
    - Name: Power EM4
      Model: Shelly3EM-63T
      Hostname: 192.168.87.43
      ExpectOffline: True
      Meters:
        - Name: "Power EM4.1"
        - Name: "Power EM4.2"
        - Name: "Power EM4.3"
    - Name: Power EM5
      Model: Shelly3EM-63T
      Hostname: 192.168.87.44
      ExpectOffline: True
      Meters:
        - Name: "Power EM5.1"
        - Name: "Power EM5.2"
        - Name: "Power EM5.3"
    - Name: Network Rack
      Model: Shelly1PMG3
      Hostname: 192.168.87.24
      Simulate: False
      ExpectOffline: True
      Outputs:
        - Name: "Network Rack O1"


# Configure the outputs for your devices and how they behave
Outputs:
  - Name: "EM1.1 Lights"  # Power Breaker 1
    Type: meter
    DeviceMeter: Power EM1.1
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 40
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 20
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: Pool Pump   # Power Breaker 3
    DeviceOutput: Pool Pump Output
    Mode: BestPrice
    Schedule: General
    ConstraintSchedule: Pool Heating
    AmberChannel: general
    DaysOfHistory: 14
    MinHours: 3
    MinHoursAlert: True
    MaxHours: 10
    # Set TargetHours to -1 to run for all hours that fall within schedule or best price
    TargetHours: 6
    MonthlyTargetHours:
      April: 5
      May: 5
      June: 5
      July: 5
      August: 5
    MaxShortfallHours: 0
    MinOnTime: 15        # Minimum minutes to stay on once turned on
    MinOffTime: 10        # Optional: minimum minutes to stay off (prevent rapid cycling)    
    MaxBestPrice: 25.0
    MaxPriorityPrice: 30.0
    DeviceMeter: Pool Pump Meter
    MaxDailyEnergyUse: 7500
    DeviceInput: Pool Pump Input
    DeviceInputMode: TurnOn
    StopOnExit: False
    MaxAppOnTime: 60
    MaxAppOffTime: 60
  - Name: Solar Pump   # Power Breaker 3
    DeviceOutput: Solar Pump
    Mode: Schedule
    Schedule: Pool Solar
    AmberChannel: general
    DaysOfHistory: 14
    TargetHours: -1
    # Revert to 0 and False
    MinHours: 2
    MinHoursAlert: False
    MaxHours: 6
    MaxShortfallHours: 0
    MinOnTime: 10        # Minimum minutes to stay on once turned on
    MinOffTime: 5        # Optional: minimum minutes to stay off (prevent rapid cycling)
    MaxBestPrice: 25.0
    MaxPriorityPrice: 30.0
    DeviceMeter: Solar Pump Meter
    StopOnExit: False
    ParentOutput: Pool Pump
    TurnOnSequence: Turn On Solar Pump
    TurnOffSequence: Turn Off Solar Pump
    MaxAppOnTime: 60
    MaxAppOffTime: 60
    # DatesOff:
    #   - StartDate: 2026-10-16
    #     EndDate: 2026-11-01
    TempProbeConstraints:
      - TempProbe: Temp Roof
        Condition: GreaterThan
        Temperature: 37.0
        FallBackTemp: 33.0
      - TempProbe: Temp Pool Water
        Condition: LessThan
        Temperature: 31.0
  - Name: Solar Fan   # Power Breaker 3
    DeviceOutput: Solar Fan Output
    Mode: Schedule
    Schedule: Pool Solar Fan
    AmberChannel: general
    DaysOfHistory: 14
    TargetHours: -1
    MinHours: 0
    MaxHours: 18
    MaxShortfallHours: 0
    MaxBestPrice: 20.0
    MaxPriorityPrice: 21.0
    StopOnExit: False
    TempProbeConstraints:
      - TempProbe: Pool Solar
        Condition: GreaterThan
        Temperature: 75.0
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: "EM4.1 Living & Beds"  # Power Breaker 4
    Type: meter
    DeviceMeter: Power EM4.1
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 40
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 20
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: "EM4.2 Kitchen & Laundry"  # Power Breaker 5
    Type: meter
    DeviceMeter: Power EM4.2
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 40
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 20
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: "EM4.3 Cooking"  # Power Breaker 6
    Type: meter
    DeviceMeter: Power EM4.3
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 25
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 20
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: "EM1.2 Workshop"  # Power Breaker 7
    Type: meter
    DeviceMeter: Power EM1.2
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 25
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 20
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: "EM2.1 Bedroom A/C"  # Power Breaker 8
    Type: meter
    DeviceMeter: Power EM2.1
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 20
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 100
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: Hot Water   # Power Breaker 9
    DeviceOutput: Hot Water O1
    Mode: BestPrice
    Schedule: Controlled Load
    AmberChannel: controlledLoad
    DaysOfHistory: 14
    TargetHours: -1
    DatesOff:
      - StartDate: 2026-05-12
        EndDate: 2026-09-24
    MaxBestPrice: 15.0
    MaxPriorityPrice: 20.0
    DeviceMeter: Hot Water M1
    HideFromWebApp: False
    HideFromViewerApp: False
  - Name: "EM5.1 Living A/C"  # Power Breaker 10
    Type: meter
    DeviceMeter: Power EM5.1
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 20
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 100
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: "EM5.2 Living Room"  # Power Breaker 11
    Type: meter
    DeviceMeter: Power EM5.2
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 20
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 100
    HideFromWebApp: True
    HideFromViewerApp: True    
  - Name: "EM5.3 Study A/C"   # Power Breaker 12
    Type: meter
    DeviceMeter: Power EM5.3
    Mode: BestPrice
    Schedule: General
    PowerOnThresholdWatts: 20
    PowerOffThresholdWatts: 10
    MinEnergyToLog: 100
    HideFromWebApp: True
    HideFromViewerApp: True
  - Name: Network Rack
    DeviceOutput: Network Rack O1
    Mode: BestPrice
    Schedule: General
    AmberChannel: general
    DaysOfHistory: 14
    TargetHours: -1
    MaxShortfallHours: 0
    MaxBestPrice: 50.0
    MaxPriorityPrice: 52.0
    HideFromWebApp: False
    HideFromViewerApp: False
    HideFromTempProbesSummary: True
    UPSIntegration:
      UPS: Eaton 5E UPS
      ActionIfUnhealthy: TurnOn
  - Name: Tesla
    Type: teslamate
    CarID: 1
    DaysOfHistory: 14
    AmberChannel: general
    Schedule: General
    HideFromWebApp: True
    HideFromViewerApp: False



UPSIntegration:
  Enable: True   # Set to True to enable monitoring of UPS devices
  PollingInterval: 30   # How often to check the UPS status in seconds
  DataFile: logs/ups_status.csv   # Log UPS status to a CSV file. Set to blank to disable.
  DataFileWriteInterval: 60   # How often to write the UPS status to the CSV file in seconds. Set to 0 to write on every poll (not recommended).
  DataFileMaxDays: 2  # Maximum number of days to keep in the CSV data file. 
  UPSDevices:   # A list of UPS devices to monitor. Each UPS must have a script that returns the runtime remaining in seconds and the charge remaining in percent.
    - Name: Eaton 5E UPS
      Script: scripts/ups_runtime.sh --ups eaton@localhost
      MinChargeWhenDischarging: 25   # Minimum charge remaining in percent when discharging to consider the UPS as "healthy".
      MinChargeWhenCharging: 80   # Minimum charge remaining in percent when charging to consider the UPS as "healthy".


OutputMetering:
  Enable: True    # Set to True to enable logging of output energy consumption data
  DataFile: logs/output_usage.csv     # Record to CSV data file. Required
  DataFileMaxDays: -1  # Maximum number of days to keep in the CSV data file. Set to -1 for unlimited.
  OutputsToLog:   # A list of outputs to log. These must have a meter associated with them (Outputs: [Item]: DeviceMeter field)
    - Output: Pool Pump
    - Output: Solar Pump
    - Output: Hot Water
    - Output: Tesla
    - Output: Network Rack
    - Output: "EM1.1 Lights"
      DisplayName: "Lights"
    - Output: "EM1.2 Workshop"
      DisplayName: "Workshop"
    - Output: "EM2.1 Bedroom A/C"
      DisplayName: "Bedroom A/C"
    - Output: "EM4.1 Living & Beds"
      DisplayName: "Living & Beds"
    - Output: "EM4.2 Kitchen & Laundry"
      DisplayName: "Kitchen & Laundry"
    - Output: "EM4.3 Cooking"
      DisplayName: "Cooking"
    - Output: "EM5.1 Living A/C"
      DisplayName: "Living A/C"
    - Output: "EM5.2 Living Room"
      DisplayName: "Living Room"
    - Output: "EM5.3 Study A/C"
      DisplayName: "Study A/C"


